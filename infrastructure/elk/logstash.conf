input {
  tcp {
    port  => 5000
    codec => json_lines {
      ecs_compatibility => "disabled"
    }
  }

  udp {
    port  => 5000
    codec => json_lines {
      ecs_compatibility => "disabled"
    }
  }
}

filter {
  # Drop raw HTTP requests that accidentally hit port 5000
  if [message] =~ /^(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH) \// or [message] =~ /^Host:/ or [message] =~ /^Accept/ or [message] =~ /^User-Agent/ {
    drop {}
  }

  # Drop events that failed JSON parsing
  if "_jsonparsefailure" in [tags] {
    drop {}
  }

  # Ensure @timestamp is set from Winston's timestamp field
  if [timestamp] {
    date {
      match  => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Parse service name into a searchable tag
  if [service] {
    mutate { add_tag => ["%{service}"] }
  } else {
    # Fallback so the index name never contains an unresolved placeholder
    mutate { add_field => { "service" => "unknown-service" } }
  }

  # Add environment label
  if ![env] {
    mutate { add_field => { "env" => "development" } }
  }

  # Drop noisy health-check logs
  if [message] =~ /GET \/health/ {
    drop {}
  }
}

output {
  elasticsearch {
    hosts           => ["http://elasticsearch:9200"]
    index           => "leave-management-%{[service]}-%{+YYYY.MM.dd}"
    ecs_compatibility => "disabled"
  }
  stdout { codec => rubydebug }
}

