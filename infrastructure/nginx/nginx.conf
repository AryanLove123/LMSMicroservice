worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    ##################################################
    # Logging
    ##################################################

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    ##################################################
    # Trace ID
    ##################################################

    map $http_x_trace_id $trace_id {
        default $http_x_trace_id;
        ""      $request_id;
    }

    ##################################################
    # Upstreams
    # services running on host machine
    ##################################################

    upstream auth_service {
        server auth-service:3001;
    }

    upstream employee_service {
        server employee-service:3002;
    }

    upstream leave_service {
        server leave-service-1:3003;
        server leave-service-2:3003;
    }

    upstream notification_service {
        server notification-service:3004;
    }


    ##################################################
    # Security 
    ##################################################

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    ##################################################
    # Server
    ##################################################

    server {

        listen 80;
        server_name _;

        add_header X-Trace-Id $trace_id always;

        proxy_set_header X-Trace-Id $trace_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        ##################################################
        # Health Check
        ##################################################

        location /health {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-gateway","timestamp":"$time_iso8601"}';
        }

        ##################################################
        # Internal Auth Validation
        ##################################################

        location = /internal/auth {
            internal;
            proxy_pass http://auth_service/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        ##################################################
        # Public Auth Routes
        ##################################################

        location /api/auth/login {
            proxy_pass http://auth_service/api/auth/login;
        }

        location /api/auth/refresh {
            proxy_pass http://auth_service/api/auth/refresh;
        }

        location /api/auth/ {
            auth_request /internal/auth;
            auth_request_set $user_id         $upstream_http_x_user_id;
            auth_request_set $user_role       $upstream_http_x_user_role;
            auth_request_set $user_email      $upstream_http_x_user_email;
            auth_request_set $employee_id     $upstream_http_x_employee_id;
            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-User-Role      $user_role;
            proxy_set_header X-User-Email     $user_email;
            proxy_set_header X-Employee-Id    $employee_id;
            proxy_pass http://auth_service/api/auth/;
        }

        ##################################################
        # Employee Service
        ##################################################

        location ~ ^/api/employees {
            auth_request /internal/auth;
            auth_request_set $user_id         $upstream_http_x_user_id;
            auth_request_set $user_role       $upstream_http_x_user_role;
            auth_request_set $user_email      $upstream_http_x_user_email;
            auth_request_set $employee_id     $upstream_http_x_employee_id;
            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-User-Role      $user_role;
            proxy_set_header X-User-Email     $user_email;
            proxy_set_header X-Employee-Id    $employee_id;
            proxy_set_header Authorization    $http_authorization;
            proxy_pass http://employee_service;
        }

        ##################################################
        # Leave Service
        ##################################################

        location ~ ^/api/leaves {
            auth_request /internal/auth;
            auth_request_set $user_id         $upstream_http_x_user_id;
            auth_request_set $user_role       $upstream_http_x_user_role;
            auth_request_set $user_email      $upstream_http_x_user_email;
            auth_request_set $employee_id     $upstream_http_x_employee_id;
            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-User-Role      $user_role;
            proxy_set_header X-User-Email     $user_email;
            proxy_set_header X-Employee-Id    $employee_id;
            proxy_set_header Authorization    $http_authorization;
            proxy_pass http://leave_service;
        }

        ##################################################
        # Notification Service
        ##################################################

        location ~ ^/api/notifications {
            auth_request /internal/auth;
            auth_request_set $user_id         $upstream_http_x_user_id;
            auth_request_set $user_role       $upstream_http_x_user_role;
            auth_request_set $user_email      $upstream_http_x_user_email;
            auth_request_set $employee_id     $upstream_http_x_employee_id;
            proxy_set_header X-User-Id        $user_id;
            proxy_set_header X-User-Role      $user_role;
            proxy_set_header X-User-Email     $user_email;
            proxy_set_header X-Employee-Id    $employee_id;
            proxy_set_header Authorization    $http_authorization;
            proxy_pass http://notification_service;
        }

        ##################################################
        # Unauthorized
        ##################################################

        error_page 401 = @unauthorized;
        location @unauthorized {
            default_type application/json;
            return 401 '{"success":false,"message":"Unauthorized"}';
        }
    }
}